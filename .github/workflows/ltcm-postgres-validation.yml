name: LTC-M PostgreSQL validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'database/audit/**'
      - 'tools/ltcm-normalizer/**'
      - 'scripts/**'
      - 'docs/database/**'
      - 'docs/analytics/**'
      - 'docs/frontend/**'
      - 'docs/backend/**'
      - 'docs/auth/**'
      - '.env.example'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ltcm-postgres-validation.yml'

permissions:
  contents: read

jobs:
  postgres-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
        env:
          POSTGRES_DB: ltcm_ci
          POSTGRES_INITDB_ARGS: --encoding=UTF8
          POSTGRES_PASSWORD: ltcm_ci_bootstrap_only
          POSTGRES_USER: supabase_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d ltcm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: 'true'
      PGDATABASE: ltcm_ci
      PGHOST: 127.0.0.1
      PGPASSWORD: ltcm_ci_bootstrap_only
      PGPORT: '5432'
      PGUSER: supabase_admin
      LTCM_CI_ADMIN_PASSWORD: ltcm_ci_admin_only
      LTCM_CI_POSTGRES_PASSWORD: ltcm_ci_postgres_only
      LTCM_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout review commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Reject remote configuration
        run: npm run ci:env:check

      - name: Validate P018 frontend scaffold
        run: npm run p018:acceptance

      - name: Validate P019 server PostgreSQL foundation
        run: npm run p019:acceptance

      - name: Validate P020 Auth0 authentication and session
        run: npm run p020:acceptance

      - name: Validate P022 layout and design system
        run: npm run p022:acceptance

      - name: Run static gates
        run: npm run check

      - name: Validate ephemeral PostgreSQL
        run: npm run ci:postgres:validate

      - name: Validate P030 PostgreSQL financial rules
        env:
          LTCM_P030_INTEGRATION: '1'
        run: |
          set -Eeuo pipefail
          container_name="ltcm-p030-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          p030_image="$(docker image ls --digests --format '{{.Repository}}@{{.Digest}}' \
            | awk '$1 ~ /^postgres@sha256:[0-9a-f]{64}$/ { print $1; exit }')"
          if [[ -z "$p030_image" ]]; then
            echo 'P030 PostgreSQL image digest was not available locally' >&2
            exit 1
          fi
          docker run --detach --rm \
            --name "$container_name" \
            --env POSTGRES_DB=ltcm_ci \
            --env POSTGRES_PASSWORD=ltcm_ci_bootstrap_only \
            --env POSTGRES_USER=supabase_admin \
            --publish 127.0.0.1::5432 \
            "$p030_image"

          p030_port=''
          for attempt in $(seq 1 30); do
            p030_port="$(docker port "$container_name" 5432/tcp 2>/dev/null | sed -E 's/.*:([0-9]+)$/\1/' || true)"
            if [[ -n "$p030_port" ]] && PGPASSWORD=ltcm_ci_bootstrap_only pg_isready \
              --host 127.0.0.1 --port "$p030_port" --username supabase_admin --dbname ltcm_ci >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if [[ -z "$p030_port" ]] || ! PGPASSWORD=ltcm_ci_bootstrap_only pg_isready \
            --host 127.0.0.1 --port "$p030_port" --username supabase_admin --dbname ltcm_ci >/dev/null 2>&1; then
            echo 'P030 PostgreSQL container did not become ready' >&2
            exit 1
          fi

          LTCM_P012_TEST_DATABASE_URL="postgresql://supabase_admin:ltcm_ci_bootstrap_only@127.0.0.1:${p030_port}/ltcm_ci" \
            npm run test:p030:postgres

      - name: Validate P031 PostgreSQL version workflow
        env:
          LTCM_P031_INTEGRATION: '1'
        run: |
          set -Eeuo pipefail
          container_name="ltcm-p031-${GITHUB_RUN_ID}"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          p031_image="$(docker image ls --digests --format '{{.Repository}}@{{.Digest}}' \
            | awk '$1 ~ /^postgres@sha256:[0-9a-f]{64}$/ { print $1; exit }')"
          if [[ -z "$p031_image" ]]; then
            echo 'P031 PostgreSQL image digest was not available locally' >&2
            exit 1
          fi
          docker run --detach --rm \
            --name "$container_name" \
            --env POSTGRES_DB=ltcm_ci \
            --env POSTGRES_PASSWORD=ltcm_ci_bootstrap_only \
            --env POSTGRES_USER=supabase_admin \
            --publish 127.0.0.1::5432 \
            "$p031_image"

          p031_port=''
          for attempt in $(seq 1 30); do
            p031_port="$(docker port "$container_name" 5432/tcp 2>/dev/null | sed -E 's/.*:([0-9]+)$/\1/' || true)"
            if [[ -n "$p031_port" ]] && PGPASSWORD=ltcm_ci_bootstrap_only pg_isready \
              --host 127.0.0.1 --port "$p031_port" --username supabase_admin --dbname ltcm_ci >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          if [[ -z "$p031_port" ]] || ! PGPASSWORD=ltcm_ci_bootstrap_only pg_isready \
            --host 127.0.0.1 --port "$p031_port" --username supabase_admin --dbname ltcm_ci >/dev/null 2>&1; then
            echo 'P031 PostgreSQL container did not become ready' >&2
            exit 1
          fi

          LTCM_P012_TEST_DATABASE_URL="postgresql://supabase_admin:ltcm_ci_bootstrap_only@127.0.0.1:${p031_port}/ltcm_ci" \
            npm run test:p031:postgres

      - name: Confirm tracked files are unchanged
        run: git diff --exit-code

      - name: Upload sanitized evidence
        if: ${{ always() && hashFiles('.tmp/ci-evidence/ltcm-postgres-validation.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ltcm-postgres-validation-${{ github.run_id }}
          path: .tmp/ci-evidence/ltcm-postgres-validation.json
          if-no-files-found: error
          retention-days: 7
